name: Publish validated plugin refresh

on:
  workflow_run:
    workflows: [Validate marketplace]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: refresh-plugin-bundles
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'codex-gaz/plugin-bundle-refresh-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/merge-refresh.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
