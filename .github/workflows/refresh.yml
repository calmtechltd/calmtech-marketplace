name: Refresh plugin bundles

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-updated]
  push:
    branches: [main]
    paths:
      - plugins.json
      - scripts/**
      - .github/workflows/refresh.yml

permissions:
  contents: read

concurrency:
  group: refresh-plugin-bundles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - run: npm run refresh
      - run: npm run validate
      - run: git diff --check
      - name: Publish a refresh PR when bundles changed
        run: node scripts/publish-refresh.mjs
        env:
          GH_TOKEN: ${{ github.token }}
